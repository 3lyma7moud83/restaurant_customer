  <style>
    @font-face {
      font-family: 'Splash Cairo';
      src: url('assets/assets/fonts/Cairo-Regular.ttf') format('truetype');
      font-display: swap;
    }

    :root {
      --app-splash-bg: #0E0F10;
      --app-splash-fade-ms: 180ms;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: var(--app-height, 100%);
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      background: var(--app-splash-bg);
      color-scheme: dark;
    }

    body {
      position: fixed;
      inset: 0;
      background: var(--app-splash-bg);
    }

    @supports (height: 100dvh) {
      html,
      body {
        height: min(100dvh, var(--app-height, 100dvh));
      }
    }

    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      overflow: hidden;
      pointer-events: auto;
      background: var(--app-splash-bg);
      opacity: 1;
      transition: opacity var(--app-splash-fade-ms) ease;
    }

    #app-splash.app-splash--hidden {
      opacity: 0;
    }

    #app-splash.app-splash--video-ready #app-splash-video {
      opacity: 1;
    }

    #app-splash-poster,
    #app-splash-video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      background: var(--app-splash-bg);
    }

    #app-splash-video {
      opacity: 0;
      transition: opacity 120ms ease;
    }

    #app-splash-brand {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      direction: ltr;
    }

    #app-splash-brand span {
      position: relative;
      isolation: isolate;
      color: #F7F5F1;
      font: 700 clamp(23px, 5.5vw, 42px) / 1.35 'Splash Cairo', 'Noto Sans Arabic', sans-serif;
      letter-spacing: 0.01em;
      white-space: nowrap;
      text-align: center;
      text-shadow: 0 1px 2px rgba(14, 15, 16, 0.65);
      animation: splash-brand-in 520ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
    }

    #app-splash-brand span::before {
      content: '';
      position: absolute;
      z-index: -1;
      inset: -65% -16%;
      background: radial-gradient(ellipse at center,
        rgba(242, 140, 40, 0.58) 0%,
        rgba(224, 118, 16, 0.28) 36%,
        rgba(242, 140, 40, 0.08) 58%,
        rgba(242, 140, 40, 0) 74%);
    }

    #app-splash-retry {
      position: absolute;
      bottom: max(28px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(242, 140, 40, 0.55);
      color: #F7F5F1;
      background: #0E0F10;
      cursor: pointer;
    }

    #app-splash-retry:focus-visible {
      outline: 2px solid #F28C28;
      outline-offset: 4px;
    }

    @keyframes splash-brand-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-splash,
      #app-splash-video { transition: none; }
      #app-splash-brand span { animation: none; }
    }

  <script>
    (function () {
      function applyAppHeight() {
        var viewport = window.visualViewport;
        var height = viewport ? viewport.height : window.innerHeight;
        document.documentElement.style.setProperty('--app-height', height + 'px');
      }

      applyAppHeight();
      window.addEventListener('resize', applyAppHeight);
      window.addEventListener('orientationchange', applyAppHeight);

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', applyAppHeight);
        window.visualViewport.addEventListener('scroll', applyAppHeight);
      }
    })();
  </script>

  <script id="app-splash-controller">
    (function () {
      var overlay = document.getElementById('app-splash');
      var video = document.getElementById('app-splash-video');
      var retry = document.getElementById('app-splash-retry');
      if (!overlay || !video) return;

      var durationMs = 2500;
      var fadeMs = 180;
      var startedAt = null;
      var deadlineAt = null;
      var appReady = false;
      var disposed = false;
      var fading = false;
      var videoReleased = false;
      var playbackAttempted = false;
      var fadeTimer = null;
      var deadlineTimer = null;
      var removeTimer = null;
      var watchdogTimer = null;
      var frameRequest = null;
      var presentationRequest = null;
      var metrics = window.__appSplashMetrics = {
        targetDurationMs: durationMs,
        fadeMs: fadeMs,
        startedAt: null,
        deadlineAt: null,
        firstFrameAt: null,
        appReadyAt: null,
        fadeStartedAt: null,
        videoStoppedAt: null,
        hiddenAt: null,
        removedAt: null,
        heldForApp: false,
        playbackRate: null,
        fallbackReason: null,
        watchdogAt: null
      };

      function releaseVideo(reason) {
        if (videoReleased) return;
        videoReleased = true;
        metrics.videoStoppedAt = performance.now();
        if (reason) metrics.fallbackReason = reason;
        if (frameRequest !== null && video.cancelVideoFrameCallback) {
          video.cancelVideoFrameCallback(frameRequest);
          frameRequest = null;
        }
        video.removeEventListener('loadedmetadata', fitPlaybackToDeadline);
        video.removeEventListener('playing', onPlaying);
        video.removeEventListener('error', onVideoError);
        video.pause();
        overlay.classList.remove('app-splash--video-ready');
        video.removeAttribute('src');
        video.querySelectorAll('source').forEach(function (source) {
          source.removeAttribute('src');
        });
        video.load();
      }

      function removeOverlay() {
        if (disposed) return;
        disposed = true;
        window.clearTimeout(fadeTimer);
        window.clearTimeout(deadlineTimer);
        window.clearTimeout(removeTimer);
        window.clearTimeout(watchdogTimer);
        if (presentationRequest !== null) {
          window.cancelAnimationFrame(presentationRequest);
        }
        window.removeEventListener('delivery-mat3mk-web-splash-ready', onAppReady);
        window.removeEventListener('pageshow', onResume);
        document.removeEventListener('visibilitychange', onVisibilityChange);
        if (retry) retry.removeEventListener('click', reloadApp);
        metrics.hiddenAt = performance.now();
        metrics.removedAt = metrics.hiddenAt;
        overlay.remove();
        releaseVideo();
        window.dispatchEvent(new Event('delivery-mat3mk-web-splash-removed'));
      }

      function beginFade() {
        if (disposed || fading || !appReady || startedAt === null) return;
        fading = true;
        var now = performance.now();
        var remaining = deadlineAt - now;
        // Once the visual budget has elapsed, a newly ready app is revealed
        // immediately; slow bootstrap must not add another fade timer.
        if (remaining <= 0) {
          removeOverlay();
          return;
        }
        var transitionMs = Math.min(fadeMs, remaining);
        metrics.fadeStartedAt = now;
        overlay.style.setProperty('--app-splash-fade-ms', transitionMs + 'ms');
        overlay.classList.add('app-splash--hidden');
        // For a ready app, the fade belongs INSIDE the 2.5 second deadline.
        // A slow bootstrap keeps the poster until a real app frame is ready.
        removeTimer = window.setTimeout(removeOverlay, transitionMs);
      }

      function reachDeadline() {
        if (disposed) return;
        if (appReady) {
          removeOverlay();
          return;
        }
        releaseVideo();
        metrics.heldForApp = true;
      }

      function onAppReady() {
        if (disposed || appReady) return;
        appReady = true;
        metrics.appReadyAt = performance.now();
        if (startedAt !== null && performance.now() >= deadlineAt - fadeMs) {
          beginFade();
        }
      }

      function showVideoFrame() {
        frameRequest = null;
        if (disposed || videoReleased || startedAt === null) return;
        if (performance.now() >= deadlineAt) {
          reachDeadline();
          return;
        }
        if (metrics.firstFrameAt === null) metrics.firstFrameAt = performance.now();
        overlay.classList.add('app-splash--video-ready');
      }

      function fitPlaybackToDeadline() {
        if (videoReleased || deadlineAt === null || !isFinite(video.duration)) return;
        var remainingMs = deadlineAt - performance.now();
        var remainingVideo = video.duration - video.currentTime;
        if (remainingMs <= 0) {
          reachDeadline();
        } else if (remainingVideo > 0) {
          // The packaged MP4 is already 2.5s. Compensate once for decode latency.
          video.playbackRate = Math.min(4, Math.max(1, remainingVideo * 1000 / remainingMs));
          metrics.playbackRate = video.playbackRate;
        }
      }

      function onPlaying() {
        if (videoReleased) return;
        fitPlaybackToDeadline();
        if (video.requestVideoFrameCallback) {
          if (frameRequest === null) frameRequest = video.requestVideoFrameCallback(showVideoFrame);
        } else {
          showVideoFrame();
        }
      }

      function onVideoError() {
        releaseVideo('media-error');
      }

      function startPresentation() {
        presentationRequest = null;
        if (disposed || startedAt !== null || document.hidden) return;
        startedAt = performance.now();
        deadlineAt = startedAt + durationMs;
        metrics.startedAt = startedAt;
        metrics.deadlineAt = deadlineAt;
        fadeTimer = window.setTimeout(beginFade, durationMs - fadeMs);
        deadlineTimer = window.setTimeout(reachDeadline, durationMs);
        watchdogTimer = window.setTimeout(function () {
          if (disposed || appReady) return;
          metrics.watchdogAt = performance.now();
          if (retry) retry.hidden = false;
        }, 15000);
        if (videoReleased || playbackAttempted) return;
        playbackAttempted = true;
        video.muted = true;
        video.defaultMuted = true;
        video.playsInline = true;
        video.loop = false;
        fitPlaybackToDeadline();
        try {
          var promise = video.play();
          if (promise && typeof promise.catch === 'function') {
            promise.catch(function () {
              if (!videoReleased) releaseVideo('autoplay-rejected');
            });
          }
        } catch (_) {
          releaseVideo('autoplay-rejected');
        }
      }

      function onResume() {
        if (disposed || document.hidden) return;
        if (startedAt === null) {
          if (presentationRequest === null) {
            presentationRequest = window.requestAnimationFrame(startPresentation);
          }
        } else if (performance.now() >= deadlineAt) {
          // Browser background throttling must never restart the video or timer.
          reachDeadline();
        }
      }

      function onVisibilityChange() {
        if (document.hidden && startedAt !== null) {
          releaseVideo('backgrounded');
        } else {
          onResume();
        }
      }

      function reloadApp() {
        window.location.reload();
      }

      window.addEventListener('delivery-mat3mk-web-splash-ready', onAppReady);
      window.addEventListener('pageshow', onResume);
      document.addEventListener('visibilitychange', onVisibilityChange);
      video.addEventListener('loadedmetadata', fitPlaybackToDeadline);
      video.addEventListener('playing', onPlaying);
      video.addEventListener('error', onVideoError);
      if (retry) retry.addEventListener('click', reloadApp);
      // Keep this controller inline: the startup clock must not await a JS fetch.
      presentationRequest = window.requestAnimationFrame(startPresentation);
    })();
  </script>

  <script>
    (function () {
      if (!('serviceWorker' in navigator)) {
        return;
      }

      function resolveScopePath() {
        var base = new URL(document.baseURI || window.location.href);
        var path = base.pathname || '/';
        if (!path.endsWith('/')) {
          path = path.substring(0, path.lastIndexOf('/') + 1) || '/';
        }
        return path;
      }

      var scopePath = resolveScopePath();
      var scriptUrl = new URL('firebase-messaging-sw.js', document.baseURI || window.location.href).toString();
      window.__fcmServiceWorkerMeta = {
        scriptUrl: scriptUrl,
        scope: scopePath,
      };

      var registrationPromise = navigator.serviceWorker
        .register(scriptUrl, { scope: scopePath })
        .then(function (registration) {
          console.log(
            '[FCM][web] firebase-messaging-sw.js registered:',
            registration.scope
          );
          return navigator.serviceWorker.ready;
        })
        .then(function (readyRegistration) {
          console.log(
            '[FCM][web] firebase-messaging-sw.js ready:',
            readyRegistration.scope
          );
          return readyRegistration;
        })
        .catch(function (error) {
          console.error('[FCM][web] service worker registration failed.', error);
          return null;
        });

      window.__fcmServiceWorkerReady = registrationPromise;
    })();
  </script>
