  <style>
    :root {
      --app-splash-bg: #0E0F10;
      --app-splash-fade-ms: 180ms;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: var(--app-height, 100%);
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      background: var(--app-splash-bg);
      color-scheme: dark;
    }

    body {
      position: fixed;
      inset: 0;
      background: var(--app-splash-bg);
    }

    @supports (height: 100dvh) {
      html,
      body {
        height: min(100dvh, var(--app-height, 100dvh));
      }
    }

    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      overflow: hidden;
      pointer-events: none;
      background: var(--app-splash-bg);
      transition:
        opacity var(--app-splash-fade-ms) ease,
        visibility var(--app-splash-fade-ms) ease;
    }

    #app-splash.app-splash--hidden {
      opacity: 0;
      visibility: hidden;
    }

    #app-splash.app-splash--video-ready #app-splash-video {
      opacity: 1;
    }

    #app-splash-video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      opacity: 0;
      background: var(--app-splash-bg);
      transition: opacity 220ms ease;
    }

    flutter-view,
    flt-glass-pane,
    flt-scene-host,
    flt-scene {
      background: transparent !important;
    }

<body>
  <div id="app-splash" aria-hidden="true">
    <video
      id="app-splash-video"
      autoplay
      muted
      playsinline
      preload="auto"
      disablePictureInPicture
      disableremoteplayback
    >
      <source src="assets/assets/videos/splash.mp4" type="video/mp4" />
    </video>
  </div>

  <script>
    (function () {
      function applyAppHeight() {
        var viewport = window.visualViewport;
        var height = viewport ? viewport.height : window.innerHeight;
        document.documentElement.style.setProperty('--app-height', height + 'px');
      }

      applyAppHeight();
      window.addEventListener('resize', applyAppHeight);
      window.addEventListener('orientationchange', applyAppHeight);

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', applyAppHeight);
        window.visualViewport.addEventListener('scroll', applyAppHeight);
      }
    })();
  </script>

  <script>
    (function () {
      var overlay = document.getElementById('app-splash');
      var video = document.getElementById('app-splash-video');
      if (!overlay || !video) {
        return;
      }

      var minVisualMs = 1500;
      var targetVideoMs = 1150;
      var maxVisualMs = 1700;
      var fadeMs = 180;
      var appReady = false;
      var visualReady = false;
      var hidden = false;
      var startedAt = performance.now();
      var visualTimerId = null;

      window.__appSplashMetrics = {
        startedAt: startedAt,
        targetVideoMs: targetVideoMs,
        minVisualMs: minVisualMs,
        maxVisualMs: maxVisualMs,
        fadeMs: fadeMs,
        firstFrameAt: null,
        appReadyAt: null,
        hiddenAt: null,
        removedAt: null
      };

      function maybeHide() {
        if (hidden || !appReady || !visualReady) {
          return;
        }

        hidden = true;
        window.__appSplashMetrics.hiddenAt = performance.now();
        overlay.classList.add('app-splash--hidden');
        window.setTimeout(function () {
          window.__appSplashMetrics.removedAt = performance.now();
          overlay.remove();
          window.dispatchEvent(new Event('delivery-mat3mk-web-splash-removed'));
        }, fadeMs + 40);
      }

      function markVisualReady() {
        if (visualReady) {
          return;
        }

        visualReady = true;
        maybeHide();
      }

      function scheduleVisualReady() {
        if (visualTimerId !== null || hidden || visualReady) {
          return;
        }
        visualTimerId = window.setTimeout(markVisualReady, targetVideoMs);
      }

      window.addEventListener(
        'delivery-mat3mk-web-splash-ready',
        function () {
          appReady = true;
          window.__appSplashMetrics.appReadyAt = performance.now();
          maybeHide();
        },
        { once: true }
      );

      video.addEventListener(
        'loadeddata',
        function () {
          if (window.__appSplashMetrics.firstFrameAt === null) {
            window.__appSplashMetrics.firstFrameAt = performance.now();
          }
          overlay.classList.add('app-splash--video-ready');
          scheduleVisualReady();
        },
        { once: true }
      );

      video.addEventListener(
        'playing',
        function () {
        },
        { once: true }
      );

      video.addEventListener(
        'ended',
        function () {
          markVisualReady();
        },
        { once: true }
      );

      video.addEventListener(
        'error',
        function () {
          var elapsed = performance.now() - startedAt;
          var remaining = Math.max(0, minVisualMs - elapsed);
          window.setTimeout(markVisualReady, remaining);
        },
        { once: true }
      );

      window.setTimeout(markVisualReady, maxVisualMs);

      window.setTimeout(function () {
        if (!video.paused || hidden || visualReady) {
          return;
        }
        var playPromise = video.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(function () {
            var elapsed = performance.now() - startedAt;
            var remaining = Math.max(0, minVisualMs - elapsed);
            window.setTimeout(markVisualReady, remaining);
          });
        }
      }, 120);
    })();
  </script>

  <script>
    (function () {
      if (!('serviceWorker' in navigator)) {
        return;
      }

      function resolveScopePath() {
        var base = new URL(document.baseURI || window.location.href);
        var path = base.pathname || '/';
        if (!path.endsWith('/')) {
          path = path.substring(0, path.lastIndexOf('/') + 1) || '/';
        }
        return path;
      }

      var scopePath = resolveScopePath();
      var scriptUrl = new URL('firebase-messaging-sw.js', document.baseURI || window.location.href).toString();
      window.__fcmServiceWorkerMeta = {
        scriptUrl: scriptUrl,
        scope: scopePath,
      };

      var registrationPromise = navigator.serviceWorker
        .register(scriptUrl, { scope: scopePath })
        .then(function (registration) {
          console.log(
            '[FCM][web] firebase-messaging-sw.js registered:',
            registration.scope
          );
          return navigator.serviceWorker.ready;
        })
        .then(function (readyRegistration) {
          console.log(
            '[FCM][web] firebase-messaging-sw.js ready:',
            readyRegistration.scope
          );
          return readyRegistration;
        })
        .catch(function (error) {
          console.error('[FCM][web] service worker registration failed.', error);
          return null;
        });

      window.__fcmServiceWorkerReady = registrationPromise;
    })();
  </script>
