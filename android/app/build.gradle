plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

def releaseKeystoreFile = rootProject.file("../upload-keystore.jks")
def releaseKeyAlias = System.getenv("UPLOAD_KEY_ALIAS") ?: keystoreProperties['keyAlias']
def releaseStorePassword = System.getenv("UPLOAD_KEYSTORE_PASSWORD") ?: keystoreProperties['storePassword']
def releaseKeyPassword = System.getenv("UPLOAD_KEY_PASSWORD") ?: keystoreProperties['keyPassword']

def hasReleaseSigning = releaseKeystoreFile.exists() &&
        releaseStorePassword &&
        releaseKeyAlias &&
        releaseKeyPassword

if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") } &&
        !hasReleaseSigning) {
    throw new GradleException(
            "Release signing must use ../upload-keystore.jks. Provide " +
                    "UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS, and UPLOAD_KEY_PASSWORD " +
                    "or matching values in android/key.properties.")
}

android {
    namespace = "com.example.restaurant_customer"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId = "com.example.restaurant_customer"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
                storeFile = releaseKeystoreFile
                storePassword = releaseStorePassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release

            // Optional APK size optimizations (enable after testing):
            // minifyEnabled true
            // shrinkResources true
        }
    }
}

flutter {
    source = "../.."
}
